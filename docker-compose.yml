
services:
  db:
    image: postgres:16-alpine
    container_name: community-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-communitiy_database}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-communitiy_database}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: community-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      API_PREFIX: ${API_PREFIX:-api}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.rosefly.store}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rosefly.store,https://www.rosefly.store}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TRUST_PROXY: ${TRUST_PROXY:-1}

      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-communitiy_database}
      DB_SSL: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      IMPORTER_ORIGIN: http://importer:4317
      IMPORTER_SECRET_FILE: /app/storage/importer-control/key

      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-}
      MEDIA_LOCAL_DIR: /app/storage/media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-/api/backend}
      MEDIA_MAX_VIDEO_UPLOAD_BYTES: ${MEDIA_MAX_VIDEO_UPLOAD_BYTES:-4294967296}
      MEDIA_VIDEO_MAX_DURATION_SECONDS: ${MEDIA_VIDEO_MAX_DURATION_SECONDS:-0}
      MEDIA_VIDEO_CRF: ${MEDIA_VIDEO_CRF:-26}
      MEDIA_TRANSCODE_CONCURRENCY: ${MEDIA_TRANSCODE_CONCURRENCY:-1}
      CALL_STUN_URLS: ${CALL_STUN_URLS:-stun:stun.l.google.com:19302}
      CALL_TURN_URLS: ${CALL_TURN_URLS:-turn:${TURN_PUBLIC_IP:-13.140.148.251}:3478?transport=udp,turn:${TURN_PUBLIC_IP:-13.140.148.251}:3478?transport=tcp}
      CALL_TURN_SECRET: ${CALL_TURN_SECRET:-}
      CALL_TURN_SECRET_FILE: /app/storage/turn-control/key

    ports:
      - "127.0.0.1:3101:3002"

    volumes:
      - media_data:/app/storage/media
      - importer_control:/app/storage/importer-control
      - turn_control:/app/storage/turn-control

    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "try{const r=await fetch('http://127.0.0.1:3002/');process.exit(r.ok?0:1)}catch{process.exit(1)}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    command: >
      sh -c "node dist/database/migrate.js run &&
             node dist/main.js"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: community-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:3002}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

    ports:
      - "127.0.0.1:3100:3000"

  turn:
    build:
      context: ./deploy
      dockerfile: turn.Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:-13.140.148.251}
      CALL_TURN_SECRET: ${CALL_TURN_SECRET:-}
    volumes:
      - turn_control:/run/circle-turn:ro

  importer:
    build:
      context: .
      dockerfile: tools/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      CIRCLE_WEB_URL: http://web:3000
      IMPORTER_DEPLOYED: "1"
      IMPORTER_BIND: 0.0.0.0
      IMPORTER_PORT: 4317
      IMPORTER_STATE_DIR: /app/importer-state
      IMPORTER_SECRET_FILE: /run/circle-importer/key
      IMPORTER_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_UPLOAD_BYTES:-4294967296}
    volumes:
      - importer_state:/app/importer-state
      - importer_control:/run/circle-importer:ro
    # No public port: browser requests go through the authenticated NestJS admin relay.
    shm_size: 512m
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "import fs from 'node:fs';try{const r=await fetch('http://127.0.0.1:4317/api/backend/importer/health',{headers:{'X-Importer-Key':fs.readFileSync('/run/circle-importer/key','utf8').trim(),'X-Social-Client':'web'}});process.exit(r.ok?0:1)}catch{process.exit(1)}"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  db_data:
  media_data:
  importer_state:
  importer_control:
  turn_control:
