
services:
  db:
    image: postgres:16-alpine
    container_name: community-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-communitiy_database}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-communitiy_database}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: community-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      API_PREFIX: ${API_PREFIX:-api}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-docs}

      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.rosefly.store}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rosefly.store,https://www.rosefly.store}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      TRUST_PROXY: ${TRUST_PROXY:-1}

      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-communitiy_database}
      DB_SSL: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}

      MEDIA_URL_SECRET: ${MEDIA_URL_SECRET:-}
      MEDIA_LOCAL_DIR: /app/storage/media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-/api/backend}
      MEDIA_MAX_VIDEO_UPLOAD_BYTES: ${MEDIA_MAX_VIDEO_UPLOAD_BYTES:-4294967296}
      MEDIA_VIDEO_MAX_DURATION_SECONDS: ${MEDIA_VIDEO_MAX_DURATION_SECONDS:-0}
      MEDIA_VIDEO_CRF: ${MEDIA_VIDEO_CRF:-26}
      MEDIA_TRANSCODE_CONCURRENCY: ${MEDIA_TRANSCODE_CONCURRENCY:-1}

    ports:
      - "127.0.0.1:3101:3002"

    volumes:
      - media_data:/app/storage/media

    command: >
      sh -c "node dist/database/migrate.js run &&
             node dist/main.js"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: community-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://api:3002}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

    ports:
      - "127.0.0.1:3100:3000"

volumes:
  db_data:
  media_data:
